<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0703" />
  <title>Page Not Found · ABU ADAMZ</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#2a1b0a,#0a0703 58%);color:#f7ecd6;padding:24px;text-align:center}
    main{max-width:620px;padding:clamp(32px,7vw,72px);border:1px solid rgba(233,185,73,.25);border-radius:24px;background:rgba(18,12,5,.86);box-shadow:0 30px 80px rgba(0,0,0,.5)}
    strong{display:block;font-size:clamp(72px,20vw,160px);line-height:.85;color:#e9b949}
    h1{margin:26px 0 12px;font-size:clamp(28px,6vw,48px)}
    p{margin:0 0 28px;color:#b39c73;line-height:1.7}
    a{display:inline-flex;padding:14px 24px;border-radius:12px;background:linear-gradient(#fce9a8,#b9822a);color:#1a1206;font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid #fff;outline-offset:5px}
  </style>
</head>
<body>
  <main>
    <strong>404</strong>
    <h1>Page Not Found</h1>
    <p>The requested page does not exist. Return to the official ABU ADAMZ website.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
